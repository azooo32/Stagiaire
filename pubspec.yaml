name: flutter_app
description: Stagiaire Quiz Bank Flutter Application
publish_to: 'none'
version: 1.0.0+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.0
  font_awesome_flutter: ^11.0.0
  provider: ^6.1.2
  intl: ^0.20.2
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  file_picker: ^8.0.0
  record: ^6.2.1
  video_player: ^2.8.2
  chewie: ^1.8.1
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  flutter_native_splash: ^2.4.0
  image_picker: ^1.2.3
  crop_your_image: ^2.0.0
  screen_protector: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding_bg.jpeg
    - assets/home_header.png
    - assets/home_study.png
    - assets/IMG_4668.PNG
    - assets/IMG_4669.PNG
    - assets/IMG_4670.PNG
    - assets/file_00000000985c71f481237896d57282a1.png
    - assets/Picsart_26-07-13_19-40-06-144.png
    - assets/IMG_٢٠٢٦٠٧١٣_١٨٣٠٣٤.png.jpg
    - assets/app_logo.png
    - assets/launcher_logo_inverted.png

flutter_native_splash:
  color: "#ffffff"
  image: "assets/app_logo.png"
  android_12:
    color: "#ffffff"
    image: "assets/app_logo.png"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher_logo_inverted.png"






